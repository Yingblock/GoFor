<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22304a" />
    <meta name="description" content="离线优先的学习辅助工具：纸是主输入端" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>GoFor</title>
    <script>
      // 在样式与 React 之前设好主题，避免深色模式启动闪白（P2-2.16）。
      // var 必须放在脚本顶层：Biome 不允许 try 里声明提升到全局的 var。
      var goforTheme = null;
      try {
        goforTheme = localStorage.getItem('gofor.ui.theme');
      } catch {
        goforTheme = null;
      }
      var goforDark =
        goforTheme === 'dark' ||
        (goforTheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = goforDark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = goforDark ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
